events {}

http {
    log_format soc_json escape=json '{"time":"$time_iso8601","src_ip":"$remote_addr","method":"$request_method","uri":"$request_uri","status":"$status","bytes":"$body_bytes_sent","user_agent":"$http_user_agent","referer":"$http_referer","app":"$server_name","request_time":"$request_time"}';

    access_log /dev/stdout soc_json;
    error_log /dev/stderr warn;

    include /etc/nginx/blocklist/*.conf;

    server {
        listen 8081;
        server_name dvwa;
        location / {
            proxy_pass http://dvwa:80;
            proxy_set_header Host $http_host;
        }
    }

    server {
        listen 8082;
        server_name juiceshop;
        location / {
            proxy_pass http://juiceshop:3000;
            proxy_set_header Host $http_host;
        }
    }
}
